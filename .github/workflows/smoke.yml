name: smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      WDIO_ENV: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The APK comes from the private chefplanner repo's build-apk workflow. GITHUB_TOKEN
      # can't read another repo's artifacts, so this uses a fine-grained token with
      # Actions: read on chefplanner. Artifacts expire after 7 days, so take the newest
      # unexpired one from main rather than the newest run.
      - name: Download ChefPlanner APK
        env:
          GH_TOKEN: ${{ secrets.CHEFPLANNER_ARTIFACTS_TOKEN }}
        run: |
          run_id=$(gh api 'repos/tenthousandrpm/chefplanner/actions/artifacts?name=chefplanner-debug.apk&per_page=100' \
            --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main")][0].workflow_run.id // empty')
          if [ -z "$run_id" ]; then
            echo "::error::No unexpired chefplanner-debug.apk artifact on chefplanner main. Run build-apk there (Actions > build-apk > Run workflow) and retry."
            exit 1
          fi
          echo "Using APK from chefplanner run $run_id"
          gh run download "$run_id" -R tenthousandrpm/chefplanner -n chefplanner-debug.apk -D app
          ls -la app/

      # Lets the emulator use hardware acceleration on the Linux runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run smoke suite on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # The default (2 cores) is slow enough that Pixel Launcher can freeze right after
          # boot, and its "isn't responding" dialog then covers the app under test.
          cores: 4
          ram-size: 4096M
          # Hide system error dialogs, let the launcher settle, then close anything already
          # showing. "|| true" keeps a rejected setting or broadcast from failing the job.
          script: |
            adb shell settings put global hide_error_dialogs 1 || true
            sleep 15
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS || true
            npm run test:smoke

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          retention-days: 14
          if-no-files-found: ignore
