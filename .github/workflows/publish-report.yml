name: publish-report

# Called by smoke.yml and regression.yml after their test job. Turns the run's
# allure-results artifact into an HTML report on the gh-pages branch, served at
# https://tenthousandrpm.github.io/automation-ui-appium-typescript/
on:
  workflow_call:
    inputs:
      suite:
        description: Suite name, used in the report folder (reports/<suite>-<run_number>)
        required: true
        type: string
      result:
        description: Result of the test job (success, failure, cancelled)
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    env:
      REPORT_DIR: ${{ inputs.suite }}-${{ github.run_number }}
      PAGES_URL: https://tenthousandrpm.github.io/automation-ui-appium-typescript

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # The test job can fail before any test runs (e.g. no APK artifact), leaving
      # nothing to download. Skip the rest instead of failing a second job.
      - name: Download Allure results
        id: results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-results
          path: allure-results

      - name: Generate Allure report
        if: steps.results.outcome == 'success'
        # Same Allure CLI version as package.json, without installing Appium and the rest.
        run: npx --yes allure-commandline@2.41.0 generate allure-results --clean -o allure-report

      # Smoke and regression run in parallel on the same PR, so the two publish jobs can
      # race to push. A rejected push restarts from the latest gh-pages instead of
      # rebasing, because both sides rewrite index.html. (A `concurrency` group would
      # serialize them too, but it silently cancels queued runs, losing their reports.)
      - name: Publish to gh-pages
        if: steps.results.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          RESULT: ${{ inputs.result }}
          SUITE: ${{ inputs.suite }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            rm -rf site
            if git ls-remote --exit-code --heads "$remote" gh-pages >/dev/null; then
              git clone --quiet --depth 1 --branch gh-pages "$remote" site
            else
              git init --quiet -b gh-pages site
              git -C site remote add origin "$remote"
            fi

            rm -rf "site/reports/$REPORT_DIR"
            mkdir -p site/reports
            cp -r allure-report "site/reports/$REPORT_DIR"
            jq -n \
              --arg suite "$SUITE" --arg runNumber "$GITHUB_RUN_NUMBER" --arg result "$RESULT" \
              --arg branch "$BRANCH" --arg sha "$GITHUB_SHA" \
              --arg runUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '$ARGS.named' > "site/reports/$REPORT_DIR/meta.json"
            touch site/.nojekyll
            node scripts/build-report-index.mjs site 10

            git -C site add -A
            git -C site commit --quiet -m "report: $REPORT_DIR ($RESULT)"
            if git -C site push --quiet origin gh-pages; then
              echo "Published on attempt $attempt"
              echo "Allure report: $PAGES_URL/reports/$REPORT_DIR/" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Push rejected (attempt $attempt), retrying from the latest gh-pages"
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the report to gh-pages after 5 attempts"
          exit 1
